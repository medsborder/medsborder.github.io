name: Check source links

# Weekly: government sites move or disappear. Broken links fail the run (you get
# the usual notification). Unverified ones (bot blocking, timeouts) are only listed.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p audit/out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/work -w /work \
            node:22-alpine node scripts/check-links.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: audit/out/links.json
          retention-days: 30
